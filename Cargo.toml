[workspace]
resolver = "2"
members = ["crates/engine", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
eredu = { git = "https://github.com/jbg/eredu.git", rev = "df0af944432c73bda344c8b45c687ab681c024b2", default-features = false, features = ["onig", "esaxx_fast", "image", "audio"] }
eredu-core = { git = "https://github.com/jbg/eredu.git", rev = "df0af944432c73bda344c8b45c687ab681c024b2" }
eredu-architectures = { git = "https://github.com/jbg/eredu.git", rev = "df0af944432c73bda344c8b45c687ab681c024b2" }
eredu-runtime = { git = "https://github.com/jbg/eredu.git", rev = "df0af944432c73bda344c8b45c687ab681c024b2" }
eredu-backend-mlx = { git = "https://github.com/jbg/eredu.git", rev = "df0af944432c73bda344c8b45c687ab681c024b2", default-features = false }
eredu-text = { git = "https://github.com/jbg/eredu.git", rev = "df0af944432c73bda344c8b45c687ab681c024b2" }
hf-cache-reader = "=0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
