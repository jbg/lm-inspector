[package]
name = "lm-inspector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "lm_inspector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
mlx = ["inspector-engine/mlx"]
metal = ["mlx", "inspector-engine/metal"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
inspector-engine = { path = "../crates/engine" }
# devtools: webview inspector is compiled out of release builds without it,
# and dev runs are release builds (debug inference is unusably slow).
tauri = { version = "2", features = ["devtools"] }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
